<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View File</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h4 class="mb-3">Viewing: {{ file_name }}</h4>

        {% if is_embeddable and file_url %}
            <div class="ratio ratio-4x3 border rounded">
                <iframe src="{{ file_url }}" title="{{ file_name }}" allowfullscreen style="border:0;"></iframe>
            </div>
        {% elif text_content %}
            <div class="border rounded bg-white p-3">
                <pre class="mb-0" style="white-space: pre-wrap; word-break: break-word;">{{ text_content|linebreaksbr }}</pre>
            </div>
        {% else %}
            <div class="alert alert-info">
                Preview is not available for this file type. You can open it directly below.
            </div>
        {% endif %}

        <div class="mt-3">
            <a href="{{ file_url }}" target="_blank" class="btn btn-primary me-2">
                <i class="fas fa-external-link-alt"></i> Open in new tab
            </a>
            <a href="{{ download_url }}" class="btn btn-success">
                <i class="fas fa-download"></i> Download File
            </a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.9.0/js/all.min.js"></script>
</body>
</html>
