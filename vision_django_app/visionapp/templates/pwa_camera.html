<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta charset="utf-8">
  <title>Eye Distance (PWA)</title>
  <style>
    body { margin:0; font-family: Arial, Helvetica, sans-serif; background:#111; color:#eee; }
    #video { width:100%; height:auto; background:#000; }
    #status { position:fixed; left:8px; top:8px; padding:6px 10px; background:rgba(0,0,0,0.6); border-radius:6px; }
    #overlay { position:fixed; right:8px; top:8px; padding:6px 10px; background:rgba(0,0,0,0.6); border-radius:6px; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <div id="status">Initializing camera...</div>
  <div id="overlay"></div>

  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const overlay = document.getElementById('overlay');

    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = stream;
        await new Promise(r => video.onloadedmetadata = r);
        status.textContent = 'Camera ready';
        captureLoop();
      } catch (e) {
        status.textContent = 'Camera permission required';
      }
    }

    async function captureLoop() {
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(320, video.videoWidth);
      canvas.height = Math.max(240, video.videoHeight);
      const ctx = canvas.getContext('2d');

      const sendFrame = async () => {
        try {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const data = canvas.toDataURL('image/jpeg', 0.7);
          const res = await fetch('/api/analyze_frame/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: data })
          });
          const j = await res.json();
          if (j.distance) {
            overlay.textContent = `Distance: ${j.distance} cm`;
            status.textContent = j.note || 'OK';
          } else if (j.error) {
            overlay.textContent = '';
            status.textContent = j.error;
          } else {
            overlay.textContent = '';
            status.textContent = 'No response';
          }
        } catch (e) {
          status.textContent = 'Upload error';
        }
      };

      // Send a frame every 1000ms
      setInterval(sendFrame, 1000);
    }

    start();
  </script>
</body>
</html>
